[package]
name = "UnipusAI"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "gzip", "brotli", "deflate", "http2"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
aes = "0.8"
ecb = "0.1"
hex = "0.4"
rand = "0.8"
sha1 = "0.10"
env_logger = "0.11"
log = "0.4"
